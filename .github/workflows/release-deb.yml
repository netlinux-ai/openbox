name: Build .deb package

on:
  push:
    branches: [netlinux]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config automake autoconf libtool autopoint \
            libglib2.0-dev \
            libpango1.0-dev libpangoxft-1.0-0 \
            libxml2-dev \
            libstartup-notification0-dev \
            libxcursor-dev \
            libimlib2-dev \
            librsvg2-dev \
            libice-dev libsm-dev \
            libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxau-dev libxi-dev \
            gettext

      - name: Bootstrap
        run: ./bootstrap

      - name: Configure
        run: ./configure --prefix=/usr --sysconfdir=/etc

      - name: Build
        run: make -j$(nproc)

      - name: Determine version
        id: version
        run: |
          ver=$(sed -n 's/^AC_INIT(\[openbox\], \[\([0-9.]*\)\].*/\1/p' configure.ac)
          rev=${{ github.run_number }}
          echo "version=${ver}-${rev}netlinux1" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}-${rev}netlinux1" >> "$GITHUB_OUTPUT"

      - name: Package with checkinstall
        run: |
          sudo apt-get install -y checkinstall
          sudo checkinstall --default \
            --pkgname=openbox \
            --pkgversion="${{ steps.version.outputs.version }}" \
            --requires="libglib2.0-0t64,libice6,libsm6,libstartup-notification0,libx11-6,libxau6,libxcursor1,libxext6,libxi6,libxinerama1,libxrandr2,python3" \
            --maintainer="graham@netlinux.co.uk" \
            --pakdir=. \
            --install=no \
            --fstrans=no

      - name: Repack .deb for reprepro compatibility
        run: |
          DEB=$(ls openbox_*.deb)
          sudo chmod 666 "$DEB"
          mkdir repack && cd repack
          ar x "../$DEB"
          for f in *.zst; do
            [ -f "$f" ] || continue
            zstd -d "$f"
            xz "${f%.zst}"
            rm "$f"
          done
          rm "../$DEB"
          ar rcs "../$DEB" debian-binary control.tar.xz data.tar.xz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: openbox ${{ steps.version.outputs.version }}
          body: |
            Automated build from commit ${{ github.sha }}

            Install: `sudo dpkg -i openbox_*.deb`
          files: openbox_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify package repository
        run: |
          sleep 5
          SIGNATURE=$(echo -n '{"repo":"netlinux-ai/openbox","tag":"${{ steps.version.outputs.tag }}"}' \
            | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" -binary \
            | xxd -p -c 256)
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: sha256=${SIGNATURE}" \
            -d '{"repo":"netlinux-ai/openbox","tag":"${{ steps.version.outputs.tag }}"}' \
            https://packages.netlinux.co.uk/webhook/update-repo
