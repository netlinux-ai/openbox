name: Build .deb package (dual-suite)

on:
  push:
    branches: [netlinux]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bookworm
            container: debian:bookworm
          - target: resolute
            container: ubuntu:26.04
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container }}

    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils zstd \
            build-essential dpkg-dev sudo

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential pkg-config automake autoconf libtool autopoint \
            libglib2.0-dev \
            libpango1.0-dev libpangoxft-1.0-0 \
            libxml2-dev \
            libstartup-notification0-dev \
            libxcursor-dev \
            libimlib2-dev \
            librsvg2-dev \
            libice-dev libsm-dev \
            libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxau-dev libxi-dev \
            gettext


      - name: Bootstrap
        run: ./bootstrap


      - name: Configure
        run: ./configure --prefix=/usr --sysconfdir=/etc


      - name: Build
        run: make -j$(nproc)


      - name: Determine version
        id: version
        run: |
          ver=$(sed -n 's/^AC_INIT(\[openbox\], \[\([0-9.]*\)\].*/\1/p' configure.ac)
          rev=${{ github.run_number }}
          echo "version=${ver}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"


      - name: Package with checkinstall
        run: |
          apt-get install -y checkinstall
          checkinstall --default \
            --pkgname=openbox \
            --pkgversion="${{ steps.version.outputs.version }}" \
            --requires="libglib2.0-0t64,libice6,libsm6,libstartup-notification0,libx11-6,libxau6,libxcursor1,libxext6,libxi6,libxinerama1,libxrandr2,python3" \
            --maintainer="graham@netlinux.co.uk" \
            --pakdir=. \
            --install=no \
            --fstrans=no


      - name: Repack .deb for reprepro compatibility
        run: |
          DEB=$(ls openbox_*.deb)
          chmod 666 "$DEB"
          mkdir repack && cd repack
          ar x "../$DEB"
          for f in *.zst; do
            [ -f "$f" ] || continue
            zstd -d "$f"
            xz "${f%.zst}"
            rm "$f"
          done
          rm "../$DEB"
          ar rcs "../$DEB" debian-binary control.tar.xz data.tar.xz


      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: |
            **/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute tag
        id: tag
        run: echo "tag=v${{ github.run_number }}-dualsuite" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ github.run_number }} (bookworm + resolute)
          body: |
            Dual-suite build from commit ${{ github.sha }}.
            Both ~bookworm1 and ~resolute1 .debs are attached.
          files: artifacts/**/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify package repository
        run: |
          sleep 5
          PAYLOAD='{"repo":"netlinux-ai/openbox","tag":"${{ steps.tag.outputs.tag }}"}'
          SIGNATURE=$(echo -n "$PAYLOAD" \
            | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" -binary \
            | xxd -p -c 256)
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" \
            https://packages.netlinux.co.uk/webhook/update-repo
